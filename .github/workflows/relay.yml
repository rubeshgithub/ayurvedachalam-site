name: Relay articles to CMS
on:
  push:
    branches: [main]
    paths: ["content-relay/inbox/*.json"]
  workflow_dispatch: {}
concurrency: { group: relay, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deliver each payload in content-relay/inbox/
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          set -euo pipefail
          test -n "${SITE_URL:-}" || { echo "SITE_URL secret missing"; exit 1; }
          test -n "${INGEST_KEY:-}" || { echo "INGEST_KEY secret missing"; exit 1; }
          cd content-relay
          shopt -s nullglob
          delivered=0; failed=0
          for f in inbox/*.json; do
            slug=$(basename "$f" .json)
            echo "::group::$slug"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "::error::$slug is not valid JSON"; failed=$((failed+1)); echo "::endgroup::"; continue; }
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$SITE_URL/api/cms/ingest" \
              -H "x-ingest-key: $INGEST_KEY" -H "content-type: application/json" --data-binary "@$f" || echo 000)
            status=$(python3 -c "import json;d=json.load(open('/tmp/resp.json'));print(d.get('status') or d.get('error') or '?')" 2>/dev/null || echo "?")
            echo "HTTP $code · $status"; cat /tmp/resp.json 2>/dev/null; echo
            if [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "$(date -u +%FT%TZ) $slug $status http=$code" >> delivered.log
              git rm -q "$f"; delivered=$((delivered+1))
            else
              # 409 slug exists · 422 invalid · 401 key · 5xx/000 site unreachable: the file stays for a retry
              echo "::error::$slug not delivered (HTTP $code: $status)"; failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          if [ "$delivered" -gt 0 ]; then
            git config user.name "relay-bot"; git config user.email "relay-bot@users.noreply.github.com"
            git add delivered.log
            git commit -m "relay: delivered $delivered article(s)" -m "$(tail -n "$delivered" delivered.log)"
            git push
          fi
          test "$failed" -eq 0
